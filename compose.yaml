name: project-life-rp
services:
  game:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LIFE_DB_NAME:-life_rp}
      POSTGRES_USER: ${LIFE_DB_USER:-life_rp}
      POSTGRES_PASSWORD: ${LIFE_DB_PASSWORD:?Set LIFE_DB_PASSWORD in .env to enable database profile}
    volumes:
      - life_postgres:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${LIFE_DB_USER:-life_rp} -d ${LIFE_DB_NAME:-life_rp}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  life_postgres:
