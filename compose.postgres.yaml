services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LIFE_DB_NAME:-life_rp}
      POSTGRES_USER: ${LIFE_DB_USER:-life_rp}
      POSTGRES_PASSWORD: ${LIFE_DB_PASSWORD:?Provide LIFE_DB_PASSWORD in project root .env}
    volumes:
      - life_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${LIFE_DB_USER:-life_rp} -d ${LIFE_DB_NAME:-life_rp}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  life_postgres:
