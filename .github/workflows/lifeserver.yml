name: LifeServer C++ checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  resource-runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure and compile
        run: |
          cmake -S liveserver-cpp -B liveserver-cpp/build
          cmake --build liveserver-cpp/build --config Debug
      - name: Verify resource dependency logic
        run: ctest --test-dir liveserver-cpp/build -C Debug --output-on-failure
