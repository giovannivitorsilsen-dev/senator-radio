name: PROJECT LIFE RP Core Checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Java RP Core policy tests
        run: |
          mkdir -p core-java/out
          javac -d core-java/out core-java/src/main/java/rp/core/LifeCore.java core-java/src/test/java/rp/core/LifeCoreTest.java
          java -ea -cp core-java/out rp.core.LifeCoreTest
      - name: C and C++ native ABI tests
        run: |
          cd native
          cc -c -std=c11 src/life_motion.c -o motion.o
          c++ -std=c++17 examples/main.cpp motion.o -lm -o motion_test
          ./motion_test
      - name: Node prototype syntax
        run: node --check server.js
